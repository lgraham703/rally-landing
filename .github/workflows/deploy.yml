name: Encrypt & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install staticrypt
        run: npm install -g staticrypt

      - name: Encrypt index.html
        run: |
          mkdir -p dist
          staticrypt index.html \
            --password "${{ secrets.SITE_PASSWORD }}" \
            --directory dist \
            --short \
            --template-title "Rally" \
            --template-instructions "Enter the preview password to continue." \
            --template-button "Continue"
          cp CNAME dist/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
